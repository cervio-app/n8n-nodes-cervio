# Publishes @cervio/n8n-nodes-cervio to npm with provenance on annotated v* tags.
#
# Tag convention: vX.Y.Z must match package.json "version".
#
# One-time setup (OIDC — preferred):
# 1. npmjs.com → @cervio/n8n-nodes-cervio → Settings → Trusted Publishers
#    GitHub Actions: owner cervio-app, repo n8n-nodes-cervio, workflow publish.yml
# 2. Or set repo secret NPM_TOKEN (Automation / classic publish token) as fallback
#
# Release:
#   npm version patch|minor|major   # bumps package.json + creates commit + tag
#   git push origin main --follow-tags
#   gh release create vX.Y.Z --generate-notes

name: Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to check out and publish (e.g. v0.2.1). Empty = current default branch HEAD.'
        required: false
        default: ''

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify
        run: npm run verify

      - name: Check tag matches package.json
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          REF="${GITHUB_REF_NAME:-}"
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            TAG="$REF"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG=""
          fi
          if [ -n "$TAG" ]; then
            EXPECTED="v${VERSION}"
            if [ "$TAG" != "$EXPECTED" ]; then
              echo "Tag $TAG does not match package.json version v${VERSION}"
              exit 1
            fi
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Publishing @cervio/n8n-nodes-cervio@${VERSION}"

      - name: Skip if version already on npm
        id: existing
        run: |
          set -euo pipefail
          if npm view "@cervio/n8n-nodes-cervio@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "@cervio/n8n-nodes-cervio@${VERSION} already on npm — skip publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.existing.outputs.exists != 'true'
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN:-}" ]; then
            npm config set "//registry.npmjs.org/:_authToken=${NPM_TOKEN}"
          fi
          npm publish --access public --provenance
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
