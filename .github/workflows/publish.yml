# Publishes @cervio/n8n-nodes-cervio to npm via Trusted Publishing (OIDC),
# then creates a GitHub Release for the tag.
#
# Tag convention: vX.Y.Z must match package.json "version".
#
# npm Trusted Publisher (package Settings → Trusted Publishers):
#   Organization or user: cervio-app
#   Repository: n8n-nodes-cervio
#   Workflow filename: publish.yml
#   Allowed actions: Allow `npm publish` (required)
#
# Requires npm CLI ≥ 11.5.1 for OIDC (see https://docs.npmjs.com/trusted-publishers).
#
# Provenance: enabled (requires public GitHub source repo + OIDC).
#
# Release:
#   bump package.json + CHANGELOG, commit, then:
#   git tag -a vX.Y.Z -m "vX.Y.Z" && git push origin main --follow-tags

name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  id-token: write # required for OIDC Trusted Publishing
  contents: write # create GitHub Release

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Trusted Publishing needs Node ≥ 22.14 and npm ≥ 11.5.1
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Upgrade npm for Trusted Publishing (OIDC)
        run: |
          set -euo pipefail
          npm install -g npm@^11.5.1
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests with coverage gates
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Verify
        run: npm run verify

      - name: Check tag matches package.json
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="v${VERSION}"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "Tag $TAG does not match package.json version ${EXPECTED}"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Publishing @cervio/n8n-nodes-cervio@${VERSION}"

      - name: Skip if version already on npm
        id: existing
        run: |
          set -euo pipefail
          if npm view "@cervio/n8n-nodes-cervio@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "@cervio/n8n-nodes-cervio@${VERSION} already on npm — skip publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.existing.outputs.exists != 'true'
        run: |
          set -euo pipefail
          # Do not set NODE_AUTH_TOKEN — OIDC Trusted Publishing handles auth.
          # Strip empty _authToken written by setup-node when the secret is absent.
          if [ -n "${NPM_TOKEN:-}" ]; then
            npm config set "//registry.npmjs.org/:_authToken=${NPM_TOKEN}"
          else
            if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "${NPM_CONFIG_USERCONFIG}" ]; then
              sed -i '/_authToken/d' "${NPM_CONFIG_USERCONFIG}"
            fi
            unset NODE_AUTH_TOKEN || true
          fi
          npm publish --access public --provenance
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Ensure GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists"
          else
            NOTES=""
            if [ -f CHANGELOG.md ]; then
              NOTES=$(awk -v ver="## [${VERSION}]" '
                $0 ~ ver {grab=1; next}
                grab && /^## \[/{exit}
                grab {print}
              ' CHANGELOG.md | sed '/./,$!d')
            fi
            if [ -n "$NOTES" ]; then
              gh release create "$TAG" --title "$TAG" --notes "$NOTES"
            else
              gh release create "$TAG" --title "$TAG" --generate-notes
            fi
          fi
