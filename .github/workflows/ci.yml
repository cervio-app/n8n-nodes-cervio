name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (tsc + eslint --max-warnings 0)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests with coverage gates
        run: npm run test:coverage

      - name: Verify node load + community invariants
        run: npm run verify
